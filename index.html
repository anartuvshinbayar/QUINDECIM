<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Үнэн үү? · Quindecim</title>
  <meta name="description" content="Is the climate in your soum really changing? Pick a question and one of Mongolia's 337 soums, and test 25 to 45 years of NASA data for a real trend. In Mongolian and English.">
  <meta name="theme-color" content="#F6F1E7">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Quindecim">
  <meta property="og:title" content="Үнэн үү? Is it real? Climate trends for every soum">

  <meta name="twitter:card" content="summary">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/site.css?v=202611142233">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebApplication",
        "name": "Quindecim: Is it real?",
        "alternateName": "Үнэн үү? Сум бүрийн уур амьсгалын чиг хандлага",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any web browser",
        "inLanguage": ["mn", "en"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Pick a climate question and a Mongolian soum, see yearly NASA data, and test whether the trend is real with the Mann-Kendall test and Sen's slope.",
        "creator": { "@type": "Organization", "name": "Team Quindecim, NASA Space Apps Challenge 2026, Ulaanbaatar" }
      },
      {
        "@type": "Dataset",
        "name": "Seasonal climate and vegetation series for Mongolia's 337 soums",
        "description": "One value per soum per year: summer NDVI (MODIS MOD13A2, 2001-2026), summer rainfall and summer and winter air temperature (NASA FLDAS, 1982-2026), first autumn frost (NASA POWER, 1981-2026).",
        "spatialCoverage": { "@type": "Place", "name": "Mongolia" },
        "temporalCoverage": "1981/2026",
        "variableMeasured": ["Summer NDVI", "Summer rainfall", "Summer air temperature", "Winter air temperature", "First autumn frost day"],
        "isBasedOn": ["NASA MODIS MOD13A2", "NASA FLDAS Noah", "NASA POWER", "FAO GAUL 2025"]
      }
    ]
  }
  </script>
</head>
<body class="is-loading">

  <header class="site-header" id="top">
    <div class="header-inner">
      <a class="brand" href="#top"><img src="assets/brand/quindecim-lockup-small.svg" alt="Quindecim" width="183" height="36"></a>
      <nav class="main-nav" aria-label="Main">
        <a href="#tool" data-i18n="navTool"></a>
        <a href="#glossary" data-i18n="navGlossary"></a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language / Хэл">
        <button type="button" class="lang-button" data-lang="mn" lang="mn" aria-label="Монгол">
          <svg class="flag" viewBox="0 0 30 15" aria-hidden="true">
            <rect width="30" height="15" fill="#C4272F"/><rect x="10" width="10" height="15" fill="#015197"/>
            <g fill="#F9CF02"><path d="M5 1.2c.6.8.6 1.5 0 2-.6-.5-.6-1.2 0-2z"/><circle cx="5" cy="4.6" r="0.9"/><path d="M3.6 5.6a1.4 1.4 0 0 0 2.8 0a1.6 1.6 0 0 1-2.8 0z"/><rect x="3.6" y="6.6" width="2.8" height="0.5"/><rect x="3.6" y="11.6" width="2.8" height="0.5"/><rect x="2.4" y="6.6" width="0.6" height="5.5"/><rect x="7" y="6.6" width="0.6" height="5.5"/><circle cx="5" cy="9.35" r="1.2"/></g>
          </svg>
          <span>MN</span>
        </button>
        <button type="button" class="lang-button" data-lang="en" lang="en" aria-label="English">
          <svg class="flag" viewBox="0 0 60 30" aria-hidden="true">
            <clipPath id="uk-clip"><rect width="60" height="30"/></clipPath>
            <g clip-path="url(#uk-clip)"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="2.4"/><path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/><path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/></g>
          </svg>
          <span>EN</span>
        </button>
      </div>
      <a class="button button-primary header-cta" href="#tool" data-i18n="cta"></a>
    </div>
  </header>
  <div class="band" aria-hidden="true"></div>

  <main>
    <section class="hero frame" aria-labelledby="hero-title">
      <div class="hero-art">
        <button type="button" class="hero-q q-tl" data-pick="ndvi_summer"></button>
        <button type="button" class="hero-q q-tr" data-pick="temp_summer"></button>
        <div id="hero-tiles" class="hero-tiles" aria-hidden="true"></div>
        <div class="hero-mark" aria-hidden="true"><img src="assets/brand/quindecim-mark-full.svg" alt="" width="160" height="160"></div>
        <button type="button" class="hero-q q-bl" data-pick="rain_summer"></button>
        <button type="button" class="hero-q q-br" data-pick="temp_winter"></button>
      </div>
      <div class="hero-copy">
        <h1 id="hero-title" class="hero-title" data-i18n="heroTitle" data-split></h1>
        <p class="hero-rotator" aria-live="off"><span id="rot-before"></span> <span class="rot-window"><span id="rot-word" class="rot-word"></span></span> <span id="rot-after"></span></p>
        <p class="hero-sub" data-i18n="heroSub" data-reveal></p>
        <a class="button button-primary button-big" href="#tool" data-reveal><span data-i18n="cta"></span> <span class="arrow" aria-hidden="true">→</span></a>
      </div>
    </section>

    <section id="tool" class="tool" aria-labelledby="tool-title">
      <h2 id="tool-title" class="visually-hidden" data-i18n="toolTitle"></h2>
      <p id="sample-banner" class="sample-banner" data-i18n="sample" hidden></p>
      <p id="load-error" class="load-error" role="alert" hidden></p>

      <div id="stage" class="stage">
        <div id="stage-bar" class="stage-bar">
          <div id="variable-buttons" class="variable-buttons" role="radiogroup" aria-labelledby="tool-title"></div>
          <div class="years" role="group" aria-label="Years">
            <div class="year-pick">
              <span class="year-label" data-i18n="from"></span>
              <button type="button" class="year-step" data-which="from" data-step="-1" aria-label="-1">
                <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2.5L4 6l3.5 3.5"/></svg></button>
              <select id="year-from" class="year-select"></select>
              <button type="button" class="year-step" data-which="from" data-step="1" aria-label="+1">
                <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg></button>
            </div>
            <span class="year-dash" aria-hidden="true">–</span>
            <div class="year-pick">
              <span class="year-label" data-i18n="to"></span>
              <button type="button" class="year-step" data-which="to" data-step="-1" aria-label="-1">
                <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2.5L4 6l3.5 3.5"/></svg></button>
              <select id="year-to" class="year-select"></select>
              <button type="button" class="year-step" data-which="to" data-step="1" aria-label="+1">
                <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg></button>
            </div>
          </div>
          <label class="search-box">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span class="visually-hidden" data-i18n="searchSoum"></span>
            <input id="soum-search" type="search" list="soum-list" autocomplete="off">
            <datalist id="soum-list"></datalist>
          </label>
        </div>
        <button id="map-back" class="map-back" type="button" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="visually-hidden" data-i18n="back"></span>
        </button>
        <p id="map-hint" class="map-hint" data-i18n="mapHintAimag"></p>
        <div id="map-legend" class="map-legend">
          <ul>
            <li><span class="swatch" data-verdict="real-up"></span><span id="legend-real-up"></span></li>
            <li><span class="swatch" data-verdict="possible-up"></span><span id="legend-possible-up"></span></li>
            <li><span class="swatch" data-verdict="not-proven"></span><span id="legend-not-proven"></span></li>
            <li><span class="swatch" data-verdict="possible-down"></span><span id="legend-possible-down"></span></li>
            <li><span class="swatch" data-verdict="real-down"></span><span id="legend-real-down"></span></li>
          </ul>
        </div>

        <aside id="result-panel" class="result-panel" aria-live="polite" aria-labelledby="result-title" hidden>
          <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"><ol></ol></nav>
          <div class="result-head">
            <h3 id="result-title"></h3>
            <span id="verdict-badge" class="pill"></span>
          </div>
          <div id="too-short" class="too-short" hidden></div>
          <div id="result-body">
            <figure class="chart">
              <div id="chart"></div>
              <figcaption class="chart-legend">
                <span class="key key-trend" data-i18n="chartLegendSen"></span>
                <span class="key key-band" data-i18n="chartBand"></span>
              </figcaption>
            </figure>
            <dl id="verdict" class="verdict-grid">
              <div><dt data-i18n="speed"></dt><dd id="v-speed"></dd></div>
              <div><dt data-i18n="isReal"></dt><dd id="v-real"></dd></div>
              <div class="wide"><dt data-i18n="meaning"></dt><dd id="v-meaning"></dd></div>
            </dl>
            <p id="source-line" class="source-line"></p>
            <p id="disagree-note" class="note" data-i18n="disagree" hidden></p>
          </div>
        </aside>
      </div>

      <div id="result-extras" class="result-extras" hidden>
        <details class="extra">
          <summary data-i18n="details"></summary>
          <table class="stats-table"><tbody id="stats-rows"></tbody></table>
        </details>
        <details class="extra">
          <summary data-i18n="limitsTitle"></summary>
          <ul id="limits-list" class="limits-list"></ul>
        </details>
        <button id="download" type="button" class="button button-outline" data-i18n="download"></button>
        <button id="share" type="button" class="button button-outline" data-i18n="share"></button>
      </div>
    </section>

    <section id="glossary" class="glossary" aria-labelledby="h-glossary">
      <h2 id="h-glossary" class="glossary-title" data-i18n="glossaryTitle"></h2>
      <div id="glossary-terms" class="glossary-terms" role="tablist" aria-labelledby="h-glossary"></div>
      <p id="glossary-def" class="glossary-def" role="tabpanel" aria-live="polite"></p>
    </section>
  </main>

  <div class="band" aria-hidden="true"></div>

      <p data-i18n="footerTeam"></p>
      <a href="#top" class="footer-top" data-i18n="toTop"></a>
    </div>
