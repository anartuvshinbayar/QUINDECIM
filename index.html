<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Is it real? · Quindecim</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <!--
    Structure only. Every block has a class and an id so a design can be applied in CSS
    (css/base.css) without touching the JavaScript. Text comes from js/i18n.js.
  -->
  <header class="site-header">
    <h1 id="title" data-i18n="title"></h1>
    <div class="lang-switch" role="group" aria-label="Language / Хэл">
      <button type="button" class="lang-button" data-lang="mn" lang="mn" aria-label="Монгол">
        <svg class="flag" viewBox="0 0 30 15" aria-hidden="true">
          <rect width="30" height="15" fill="#C4272F"/>
          <rect x="10" width="10" height="15" fill="#015197"/>
          <g fill="#F9CF02">
            <path d="M5 1.2c.6.8.6 1.5 0 2-.6-.5-.6-1.2 0-2z"/>
            <circle cx="5" cy="4.6" r="0.9"/>
            <path d="M3.6 5.6a1.4 1.4 0 0 0 2.8 0a1.6 1.6 0 0 1-2.8 0z"/>
            <rect x="3.6" y="6.6" width="2.8" height="0.5"/>
            <rect x="3.6" y="11.6" width="2.8" height="0.5"/>
            <rect x="2.4" y="6.6" width="0.6" height="5.5"/>
            <rect x="7" y="6.6" width="0.6" height="5.5"/>
            <circle cx="5" cy="9.35" r="1.2"/>
          </g>
        </svg>
        <span>MN</span>
      </button>
      <button type="button" class="lang-button" data-lang="en" lang="en" aria-label="English">
        <svg class="flag" viewBox="0 0 60 30" aria-hidden="true">
          <clipPath id="uk-clip"><rect width="60" height="30"/></clipPath>
          <g clip-path="url(#uk-clip)">
            <rect width="60" height="30" fill="#012169"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="2.4"/>
            <path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/>
            <path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/>
          </g>
        </svg>
        <span>EN</span>
      </button>
    </div>
  </header>

  <p id="sample-banner" class="sample-banner" data-i18n="sample" hidden></p>
  <p id="load-error" class="load-error" hidden></p>

  <main class="layout">
    <section class="step step-variable" aria-labelledby="h-step1">
      <h2 id="h-step1" data-i18n="step1"></h2>
      <div id="variable-buttons" class="variable-buttons" role="radiogroup"></div>
    </section>

    <section class="step step-place" aria-labelledby="h-step2">
      <h2 id="h-step2" data-i18n="step2"></h2>
      <label class="soum-search">
        <span data-i18n="searchSoum"></span>
        <input id="soum-search" type="search" list="soum-list" autocomplete="off">
        <datalist id="soum-list"></datalist>
      </label>
      <p class="hint" data-i18n="mapHint"></p>
      <div id="map" class="map"></div>
      <div id="map-legend" class="map-legend" hidden>
        <p data-i18n="mapLegend"></p>
        <ul>
          <li><span class="swatch" data-verdict="real-up"></span><span id="legend-real-up"></span></li>
          <li><span class="swatch" data-verdict="possible-up"></span><span id="legend-possible-up"></span></li>
          <li><span class="swatch" data-verdict="not-proven"></span><span id="legend-not-proven"></span></li>
          <li><span class="swatch" data-verdict="possible-down"></span><span id="legend-possible-down"></span></li>
          <li><span class="swatch" data-verdict="real-down"></span><span id="legend-real-down"></span></li>
        </ul>
      </div>
    </section>

    <section class="step step-years" aria-labelledby="h-step3">
      <h2 id="h-step3" data-i18n="step3"></h2>
      <label class="year-range"><span data-i18n="from"></span>
        <input id="year-from" type="range" step="1"><output id="year-from-out"></output></label>
      <label class="year-range"><span data-i18n="to"></span>
        <input id="year-to" type="range" step="1"><output id="year-to-out"></output></label>
    </section>

    <section id="guess" class="step step-guess" aria-labelledby="h-step4" hidden>
      <h2 id="h-step4" data-i18n="step4"></h2>
      <p data-i18n="guessPrompt"></p>
      <div class="guess-buttons">
        <button type="button" data-guess="up" id="guess-up"></button>
        <button type="button" data-guess="down" id="guess-down"></button>
        <button type="button" data-guess="flat" data-i18n="guessFlat"></button>
      </div>
      <button type="button" class="link-button" data-guess="skip" data-i18n="skipGuess"></button>
    </section>

    <p id="pick-first" class="hint" data-i18n="pickFirst"></p>

    <section id="result" class="result" aria-labelledby="h-result" hidden>
      <h2 id="h-result" data-i18n="resultTitle"></h2>
      <p id="guess-feedback" class="guess-feedback"></p>

      <div id="too-short" class="too-short" hidden></div>

      <div id="result-body">
        <figure class="chart">
          <div id="chart"></div>
          <figcaption class="chart-legend">
            <span class="key key-trend" data-i18n="chartLegendSen"></span>
            <span class="key key-linear" data-i18n="chartLegendLin"></span>
            <span class="key key-mean" data-i18n="chartLegendAvg"></span>
          </figcaption>
        </figure>

        <dl id="verdict" class="verdict-card">
          <dt data-i18n="whatChanged"></dt><dd id="v-what"></dd>
          <dt data-i18n="speed"></dt><dd id="v-speed"></dd>
          <dt data-i18n="isReal"></dt><dd id="v-real"></dd>
          <dt data-i18n="meaning"></dt><dd id="v-meaning"></dd>
        </dl>

        <p id="disagree-note" class="note" data-i18n="disagree" hidden></p>
        <p id="level-note" class="note"></p>

        <details class="stats-details">
          <summary data-i18n="details"></summary>
          <table class="stats-table"><tbody id="stats-rows"></tbody></table>
        </details>

        <div class="result-actions">
          <button id="download" type="button" data-i18n="download"></button>
          <button id="share" type="button" data-i18n="share"></button>
        </div>

        <aside class="limits">
          <h3 data-i18n="limitsTitle"></h3>
          <ul id="limits-list"></ul>
        </aside>
      </div>
    </section>

    <section class="glossary" aria-labelledby="h-glossary">
      <h2 id="h-glossary" data-i18n="glossaryTitle"></h2>
      <dl id="glossary-list"></dl>
    </section>
  </main>

  <!-- Plain scripts in this order. No modules and no fetch, so opening index.html as a file works too. -->
  <script src="data/data.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/variables.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
